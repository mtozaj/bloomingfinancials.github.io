name: Update sitemap lastmod

# When site pages change on main, refresh their <lastmod> in sitemap.xml so
# crawlers see honest freshness signals. The bot commit touches only
# sitemap.xml, which this workflow does not trigger on, so no loop.

on:
  push:
    branches: [main]
    paths:
      - '**.html'

permissions:
  contents: write

concurrency:
  group: sitemap-lastmod
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Update lastmod for changed pages
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 <<'PY'
          import datetime, os, re, subprocess, sys

          HOST = "https://www.bloomingfinancials.com"
          today = datetime.date.today().isoformat()

          def path_to_url(path: str) -> str:
              if path == "index.html":
                  return f"{HOST}/"
              if path.endswith("/index.html"):
                  return f"{HOST}/{path[:-len('index.html')]}"
              return f"{HOST}/{path}"

          before = os.environ.get("BEFORE_SHA", "")
          base = before if before and not re.fullmatch(r"0+", before) else "HEAD~1"
          diff = subprocess.run(
              ["git", "diff", "--name-only", base, "HEAD"],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()
          urls = {path_to_url(p) for p in diff if p.endswith(".html")}
          if not urls:
              print("No page changes; nothing to do.")
              sys.exit(0)

          with open("sitemap.xml", encoding="utf-8") as f:
              sitemap = f.read()

          changed = 0
          for url in urls:
              pattern = (
                  r"(<loc>" + re.escape(url) + r"</loc>\s*<lastmod>)[0-9-]+(</lastmod>)"
              )
              sitemap, n = re.subn(pattern, r"\g<1>" + today + r"\g<2>", sitemap)
              changed += n
          if not changed:
              print("Changed pages are not in the sitemap; nothing to do.")
              sys.exit(0)

          with open("sitemap.xml", "w", encoding="utf-8") as f:
              f.write(sitemap)
          print(f"Updated lastmod to {today} for {changed} URL(s).")
          PY

      - name: Commit and push if sitemap changed
        run: |
          if git diff --quiet sitemap.xml; then
            echo "sitemap.xml unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Update sitemap lastmod for changed pages"
          git push
